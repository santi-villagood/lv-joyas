<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joyas de Plata</title>
<meta name="theme-color" content="#2b3a67">
<link rel="icon" href="app/icons/icon-192.png">
<link rel="apple-touch-icon" href="app/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash"><div class="logo" id="slogo">LV</div><h1>LV Joyas</h1></div>
<script>try{if(sessionStorage.getItem("visto"))document.getElementById("splash").remove()}catch(e){}</script>

<header id="top">
  <div class="row">
    <div class="logo" id="logo">LOGO</div>
    <input class="search" id="q" type="search" placeholder="Buscar joyas de plata" aria-label="Buscar">
  </div>
  <div class="cats" id="cats"></div>
</header>

<main id="view"></main>

<nav>
  <button data-v="inicio" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-v="carrito"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/></svg>Carrito<span class="badge hide" id="badge">0</span></button>
  <button data-v="mas"><svg viewBox="0 0 24 24"><path d="M3 6h12M3 12h12M3 18h8M18 15v6M15 18h6"/></svg>Más</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const { SUPABASE_URL, SUPABASE_KEY, WHATSAPP, CATEGORIAS, LOGO_URL, NOMBRE } = window.CONFIG;
document.title = NOMBRE;
// Limpia el service worker viejo de la raíz (la app ahora vive en /app/)
if ("serviceWorker" in navigator) {
  const raiz = new URL("./", location.href).href;
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope === raiz) r.unregister(); }));
}

const sb = (SUPABASE_URL && SUPABASE_KEY) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const $ = s => document.querySelector(s);
const money = n => "$" + Number(n).toLocaleString("es-AR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const DEMO = [
  {id:"d1",nombre:"Anillo de plata 925 liso",precio:18500,categoria:"Anillos"},
  {id:"d2",nombre:"Collar cadena fina 45 cm",precio:24000,categoria:"Collares"},
  {id:"d3",nombre:"Aros argolla pequeños",precio:12900,categoria:"Aros"},
  {id:"d4",nombre:"Pulsera eslabones",precio:27500,categoria:"Pulseras"}
];

let productos = [], cat = "Todo", vista = "inicio";
let cart = [];
try { cart = JSON.parse(localStorage.getItem("carrito") || "[]"); } catch(e) {}
const saveCart = () => { try { localStorage.setItem("carrito", JSON.stringify(cart)); } catch(e) {} };

async function cargar() {
  if (!sb) { productos = DEMO; return; }
  const { data, error } = await sb.from("productos").select("*").order("created_at", { ascending: false });
  productos = error ? [] : data;
}

function renderCats() {
  $("#cats").innerHTML = CATEGORIAS.map(c => `<button class="${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}

function tarjeta(p) {
  const img = p.imagen_url ? `<img src="${esc(p.imagen_url)}" alt="${esc(p.nombre)}" loading="lazy">` : "Sin foto";
  return `<div class="card"><div class="ph">${img}</div><div class="info">
    <div class="price">${money(p.precio)}</div><div class="name">${esc(p.nombre)}</div>
    <button class="btn" data-add="${esc(p.id)}">Agregar al carrito</button></div></div>`;
}

function vistaInicio() {
  const t = $("#q").value.trim().toLowerCase();
  const l = productos.filter(p => (cat === "Todo" || p.categoria === cat) && p.nombre.toLowerCase().includes(t));
  $("#view").innerHTML = l.length
    ? `<div class="grid">${l.map(tarjeta).join("")}</div>`
    : `<div class="empty">No hay joyas para mostrar todavía.<br>Probá con otra categoría o búsqueda.</div>`;
}

function vistaCarrito() {
  if (!cart.length) { $("#view").innerHTML = `<div class="empty">Tu carrito está vacío.<br>Agregá joyas desde Inicio.</div>`; return; }
  let total = 0;
  const items = cart.map(i => {
    total += i.precio * i.cant;
    const img = i.imagen_url ? `<img src="${esc(i.imagen_url)}" alt="">` : "";
    return `<div class="item"><div class="ph">${img}</div><div class="grow"><div class="name">${esc(i.nombre)}</div>
      <div>${money(i.precio)}</div><div class="qty"><button data-m="${esc(i.id)}" aria-label="Quitar uno">−</button>${i.cant}<button data-p="${esc(i.id)}" aria-label="Sumar uno">+</button></div></div></div>`;
  }).join("");
  $("#view").innerHTML = `<div class="panel">${items}<div class="total"><span>Total</span><span>${money(total)}</span></div>
    <button class="btn" id="pedir">Pedir por WhatsApp</button><button class="btn sec" id="vaciar">Vaciar carrito</button></div>`;
}

function vistaMas() {
  $("#view").innerHTML = `<div class="panel"><h2>Contacto</h2><p class="msg">Consultas y pedidos por WhatsApp.</p>
    ${WHATSAPP ? `<a class="btn" href="https://wa.me/${esc(WHATSAPP)}">Escribinos</a>` : `<p class="msg">Falta cargar el número en config.js.</p>`}</div>`;
}

function render() {
  $("#cats").classList.toggle("hide", vista !== "inicio");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === vista));
  const n = cart.reduce((a, i) => a + i.cant, 0);
  $("#badge").textContent = n; $("#badge").classList.toggle("hide", !n);
  renderCats();
  ({ inicio: vistaInicio, carrito: vistaCarrito, mas: vistaMas })[vista]();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.v) { vista = t.dataset.v; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.c) { cat = t.dataset.c; vista = "inicio"; render(); return; }
  if (t.dataset.add) {
    const p = productos.find(x => String(x.id) === t.dataset.add); if (!p) return;
    const ya = cart.find(x => String(x.id) === String(p.id));
    ya ? ya.cant++ : cart.push({ id: p.id, nombre: p.nombre, precio: p.precio, imagen_url: p.imagen_url, cant: 1 });
    saveCart(); render(); return;
  }
  if (t.dataset.p || t.dataset.m) {
    const id = t.dataset.p || t.dataset.m, it = cart.find(x => String(x.id) === id);
    it.cant += t.dataset.p ? 1 : -1; cart = cart.filter(x => x.cant > 0); saveCart(); render(); return;
  }
  if (t.id === "vaciar") { cart = []; saveCart(); render(); return; }
  if (t.id === "pedir") {
    const lineas = cart.map(i => `• ${i.cant} x ${i.nombre} (${money(i.precio * i.cant)})`).join("\n");
    const total = cart.reduce((a, i) => a + i.precio * i.cant, 0);
    const txt = encodeURIComponent(`Hola, quiero hacer este pedido:\n${lineas}\nTotal: ${money(total)}`);
    window.open(`https://wa.me/${WHATSAPP}?text=${txt}`, "_blank");
  }
});

$("#q").addEventListener("input", () => { vista = "inicio"; render(); });

(async () => {
  if (LOGO_URL) {
    for (const id of ["#logo", "#slogo"]) {
      const i = new Image(); i.alt = "Logo"; i.onload = () => $(id).replaceChildren(i.cloneNode()); i.src = LOGO_URL;
    }
  }
  setTimeout(() => {
    const s = $("#splash"); if (!s) return;
    s.classList.add("out"); setTimeout(() => s.remove(), 600);
    try { sessionStorage.setItem("visto", "1"); } catch(e) {}
  }, 1500);
  await cargar(); render();
})();
</script>
</body>
</html>
